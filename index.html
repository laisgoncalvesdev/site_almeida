<!DOCTYPE html>

<meta property="og:description" content="Segurança jurídica para o seu presente e seu amanhã. Defesa técnica em questões trabalhistas e previdenciárias." />

<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved || sys);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<style>
/* ---------- Tokens de tema ---------- */
[data-theme="light"] {
  --cor-fundo: #FAF9F6;
  --cor-fundo-sec: #F0EDE7;
  --cor-superficie: #FFFFFF;
  --cor-texto: #14181F;
  --cor-texto-sec: #59616F;
  --cor-primaria: #16233A;
  --cor-primaria-hover: #0D1626;
  --cor-primaria-texto: #FFFFFF;
  --cor-acento: #C8A24A;
  --cor-acento-texto: #8A6B23;
  --cor-musgo: #4A5D46;
  --cor-borda: rgba(0, 0, 0, 0.10);
  --cor-borda-forte: rgba(0, 0, 0, 0.16);
  --cor-sombra: rgba(20, 24, 31, 0.10);
  --cor-sombra-forte: rgba(20, 24, 31, 0.16);
  --cor-header: rgba(250, 249, 246, 0.86);
  --hero-overlay-extra: 0;
}

[data-theme="dark"] {
  --cor-fundo: #0D1420;
  --cor-fundo-sec: #131C2B;
  --cor-superficie: #17212F;
  --cor-texto: #ECEAE4;
  --cor-texto-sec: #9AA3B2;
  --cor-primaria: #D8B978;
  --cor-primaria-hover: #E8CD97;
  --cor-primaria-texto: #101828;
  --cor-acento: #D8B978;
  --cor-acento-texto: #E0C48A;
  --cor-musgo: #7E9377;
  --cor-borda: rgba(255, 255, 255, 0.10);
  --cor-borda-forte: rgba(255, 255, 255, 0.18);
  --cor-sombra: rgba(0, 0, 0, 0.40);
  --cor-sombra-forte: rgba(0, 0, 0, 0.55);
  --cor-header: rgba(13, 20, 32, 0.88);
  --hero-overlay-extra: 0.18;
}

:root {
  --whats: #25D366;
  --whats-hover: #1EB855;
  --hero-fundo: #101B2B;
  --hero-fundo-2: #16233A;
  --hero-texto: #F2EFE9;
  --hero-texto-sec: #BDC5D1;
  --hero-acento: #D8B978;

  --fonte-titulo: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --fonte-corpo: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --container: 1180px;
  --pad-lateral: 20px;
  --esp-secao: 64px;
  --gap: 24px;
  --raio: 4px;
  --raio-sm: 3px;
  --altura-header: 68px;
}

@media (min-width: 768px) {
  :root { --pad-lateral: 40px; --esp-secao: 88px; --altura-header: 76px; }
}
@media (min-width: 1025px) {
  :root { --pad-lateral: 64px; --esp-secao: 104px; }
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
button, input, textarea, select { font: inherit; color: inherit; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

*, *::before, *::after {
  transition: color .3s ease, background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
}

body {
  font-family: var(--fonte-corpo);
  font-size: 1rem;
  line-height: 1.7;
  color: var(--cor-texto);
  background: var(--cor-fundo);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
@media (min-width: 768px) { body { font-size: 1.0625rem; } }

body.menu-aberto { overflow: hidden; }

/* ---------- Acessibilidade ---------- */
:focus-visible {
  outline: 3px solid var(--cor-acento);
  outline-offset: 3px;
  border-radius: 2px;
}
.pular-link {
  position: absolute; left: 50%; top: 0; transform: translate(-50%, -140%);
  z-index: 200; background: var(--cor-primaria); color: var(--cor-primaria-texto);
  padding: 12px 22px; border-radius: 0 0 var(--raio) var(--raio);
  font-size: .9rem; font-weight: 600; text-decoration: none; transition: transform .2s ease;
}
.pular-link:focus { transform: translate(-50%, 0); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Layout ---------- */
.container {
  width: 100%; max-width: var(--container); margin-inline: auto;
  padding-inline: var(--pad-lateral);
}
.secao { padding-block: var(--esp-secao); scroll-margin-top: calc(var(--altura-header) + 12px); }
.secao--alt { background: var(--cor-fundo-sec); }

/* ---------- Tipografia ---------- */
h1, h2, h3, h4 { font-family: var(--fonte-titulo); font-weight: 600; line-height: 1.15; color: var(--cor-texto); }
h1 { font-size: clamp(2.15rem, 6.2vw, 3.85rem); line-height: 1.06; letter-spacing: -0.015em; font-weight: 600; }
h2 { font-size: clamp(1.8rem, 4.4vw, 2.85rem); letter-spacing: -0.01em; }
h3 { font-size: clamp(1.2rem, 2.4vw, 1.45rem); line-height: 1.25; }
h4 { font-size: 1.08rem; line-height: 1.3; }
p { color: var(--cor-texto-sec); }
a { color: inherit; }

.sobrelinha {
  font-family: var(--fonte-corpo);
  font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  color: var(--cor-acento-texto); margin-bottom: 14px;
}
.intro-secao {
  max-width: 62ch; font-size: 1.05rem; margin-top: 18px; color: var(--cor-texto-sec);
}
.cabecalho-secao { margin-bottom: 44px; }
@media (min-width: 768px) { .cabecalho-secao { margin-bottom: 56px; } }

/* ---------- Elemento assinatura: "viga da balança" ---------- */
.viga { display: block; width: 116px; height: 12px; color: var(--cor-acento); margin-top: 18px; }
.viga--centro { margin-inline: auto; }
.viga--hero { color: var(--hero-acento); }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 13px 28px;
  font-family: var(--fonte-corpo); font-size: .95rem; font-weight: 600; letter-spacing: .02em;
  text-decoration: none; border: 1px solid transparent; border-radius: var(--raio-sm);
  cursor: pointer; transition: background-color .25s ease, color .25s ease, border-color .25s ease, transform .18s ease, box-shadow .25s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }

.btn--primario { background: var(--cor-primaria); color: var(--cor-primaria-texto); box-shadow: 0 6px 18px var(--cor-sombra); }
.btn--primario:hover { background: var(--cor-primaria-hover); box-shadow: 0 10px 26px var(--cor-sombra-forte); }

.btn--ouro { background: var(--hero-acento); color: #101828; box-shadow: 0 6px 20px rgba(0, 0, 0, .30); }
.btn--ouro:hover { background: #E8CD97; }

.btn--fantasma-claro { background: transparent; color: var(--hero-texto); border-color: rgba(242, 239, 233, .38); }
.btn--fantasma-claro:hover { border-color: var(--hero-acento); color: var(--hero-acento); }

.btn--whats {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 48px; padding: 0 26px;
  background: var(--whats); color: #064e28; border: none; border-radius: 8px;
  font-family: var(--fonte-corpo); font-size: .95rem; font-weight: 700;
  text-decoration: none; cursor: pointer; letter-spacing: .01em;
  box-shadow: 0 4px 18px rgba(37, 211, 102, .28);
  transition: background .25s ease, transform .18s ease, box-shadow .25s ease;
}
.btn--whats:hover { background: var(--whats-hover); transform: translateY(-2px); box-shadow: 0 8px 26px rgba(37, 211, 102, .38); }
.btn--whats:active { transform: translateY(0); }
.btn--whats svg { width: 20px; height: 20px; flex-shrink: 0; }

.btn--bloco { width: 100%; }
@media (min-width: 480px) { .btn--bloco { width: auto; } }

/* ---------- Header ---------- */
.cabecalho {
  position: sticky; top: 0; z-index: 100;
  background: var(--cor-header);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--cor-borda);
}
.cabecalho__inner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--altura-header);
}
.marca {
  display: flex; align-items: center; gap: 11px; min-height: 44px;
  text-decoration: none; flex-shrink: 0;
}
.marca__placa {
  display: grid; place-items: center; overflow: hidden;
  background: transparent; border-radius: var(--raio-sm); padding: 3px;
}
.marca__img { width: 34px; height: 35px; object-fit: contain; }
.marca__txt { display: flex; flex-direction: column; line-height: 1.05; }
.marca__nome {
  font-family: var(--fonte-titulo); font-size: 1.22rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--cor-texto);
}
.marca__sub {
  font-size: .58rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
  color: var(--cor-acento-texto); margin-top: 2px;
}

.nav-desktop { display: none; }
@media (min-width: 1025px) {
  .nav-desktop { display: flex; align-items: center; gap: 4px; }
}
.nav-link {
  position: relative; display: inline-flex; align-items: center;
  min-height: 44px; padding: 0 14px; white-space: nowrap;
  font-size: .92rem; font-weight: 500; color: var(--cor-texto-sec); text-decoration: none;
  transition: color .22s ease;
}
.nav-link::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 12px; height: 1px;
  background: var(--cor-acento); transform: scaleX(0); transform-origin: left; transition: transform .28s ease;
}
.nav-link:hover, .nav-link:focus-visible { color: var(--cor-texto); }
.nav-link:hover::after, .nav-link:focus-visible::after { transform: scaleX(1); }

.controles { display: flex; align-items: center; gap: 6px; }

.cabecalho__cta {
  display: none; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 20px;
  background: var(--whats); color: #064e28;
  border: none; border-radius: 999px;
  font-family: var(--fonte-corpo); font-size: .88rem; font-weight: 700;
  text-decoration: none; cursor: pointer;
  box-shadow: 0 4px 16px rgba(37, 211, 102, .25);
  transition: background .25s ease, transform .18s ease, box-shadow .25s ease;
}
.cabecalho__cta:hover {
  background: var(--whats-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37, 211, 102, .35);
}
.cabecalho__cta:active { transform: translateY(0); }
.cabecalho__cta svg { width: 18px; height: 18px; flex-shrink: 0; }
@media (min-width: 1025px) { .cabecalho__cta { display: inline-flex; margin-left: 6px; } }

.toggle-tema {
  display: grid; place-items: center; min-width: 44px; min-height: 44px;
  background: none; border: none; border-radius: 50%; cursor: pointer;
  color: var(--cor-texto); padding: 8px;
}
.toggle-tema:hover { background: var(--cor-fundo-sec); color: var(--cor-acento-texto); }
.toggle-tema svg { width: 20px; height: 20px; }

.btn-menu {
  display: grid; place-items: center; min-width: 44px; min-height: 44px;
  background: none; border: 1px solid var(--cor-borda); border-radius: var(--raio-sm);
  cursor: pointer; color: var(--cor-texto);
}
.btn-menu:hover { border-color: var(--cor-borda-forte); }
.btn-menu svg { width: 20px; height: 20px; }
@media (min-width: 1025px) { .btn-menu { display: none; } }

/* ---------- Menu mobile ---------- */
.menu-mobile {
  position: fixed; inset: var(--altura-header) 0 0 0; z-index: 99;
  background: var(--cor-fundo);
  border-top: 1px solid var(--cor-borda);
  padding: 22px var(--pad-lateral) 40px;
  overflow-y: auto;
  animation: entrada-menu .26s ease both;
}
@keyframes entrada-menu { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.menu-mobile__lista { display: flex; flex-direction: column; }
.menu-mobile__link {
  display: flex; align-items: center; min-height: 56px;
  font-family: var(--fonte-titulo); font-size: 1.4rem; font-weight: 600;
  color: var(--cor-texto); text-decoration: none;
  border-bottom: 1px solid var(--cor-borda);
}
.menu-mobile__link:hover { color: var(--cor-acento-texto); }
.menu-mobile__cta { margin-top: 28px; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(160deg, var(--hero-fundo-2) 0%, var(--hero-fundo) 62%, #0A121E 100%);
  color: var(--hero-texto);
  min-height: 80vh;
  display: flex; align-items: center;
  scroll-margin-top: var(--altura-header);
}
.hero__bg-img {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.12; pointer-events: none;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: #000; opacity: var(--hero-overlay-extra); z-index: 1;
}
.hero__inner {
  position: relative; z-index: 3;
  width: 100%; max-width: 720px;
  padding-block: 72px 80px;
}
@media (min-width: 768px) { .hero__inner { padding-block: 96px 108px; } }
@media (min-width: 1025px) { .hero__inner { padding-block: 112px 128px; } }
.hero h1 { color: var(--hero-texto); max-width: 16ch; }
.hero .sobrelinha { color: var(--hero-acento); }
.hero__sub {
  color: var(--hero-texto-sec); font-size: 1.05rem; max-width: 56ch; margin-top: 22px;
}
@media (min-width: 768px) { .hero__sub { font-size: 1.14rem; } }
.hero__acoes { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }

/* ---------- Beams ---------- */
.beams {
  position: absolute; inset: 0; overflow: hidden;
  pointer-events: none; z-index: 2;
}
.beam {
  position: absolute; top: -60%; height: 220%;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(216, 185, 120, 0.03) 25%,
    rgba(216, 185, 120, 0.18) 50%,
    rgba(216, 185, 120, 0.03) 75%,
    transparent 100%
  );
  filter: blur(2px);
  opacity: 0;
  animation: beam-glow ease-in-out infinite;
}
@keyframes beam-glow {
  0%, 100% { opacity: 0; }
  40% { opacity: 0.8; }
  60% { opacity: 0.8; }
}

/* ---------- Faixa de credenciais (estática) ---------- */
.credenciais-faixa {
  background: var(--hero-fundo);
  padding: 20px var(--pad-lateral);
  border-bottom: 1px solid rgba(216, 185, 120, .12);
}
.credenciais-faixa__inner {
  max-width: var(--container); margin-inline: auto;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 12px 40px;
}
.credencial-item {
  display: flex; align-items: center; gap: 9px;
  font-size: .84rem; font-weight: 600; letter-spacing: .04em;
  color: var(--hero-texto-sec);
  white-space: nowrap;
}
.credencial-item svg {
  width: 17px; height: 17px; color: var(--hero-acento); flex-shrink: 0;
}

/* ---------- Cards ---------- */
.grade { display: grid; gap: var(--gap); }
.grade--2 { grid-template-columns: 1fr; }
.grade--3 { grid-template-columns: 1fr; }
@media (min-width: 768px) { .grade--3 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1025px) {
  .grade--2 { grid-template-columns: repeat(2, 1fr); gap: 32px; }
  .grade--3 { grid-template-columns: repeat(3, 1fr); }
}

.card {
  position: relative; background: var(--cor-superficie);
  border: 1px solid var(--cor-borda); border-radius: var(--raio);
  padding: 28px 24px; height: 100%; overflow: hidden;
  transition: transform .4s cubic-bezier(.22,.61,.36,1), border-color .3s ease, box-shadow .4s ease;
}
@media (min-width: 768px) { .card { padding: 34px 30px; } }

.card::before {
  content: ""; position: absolute; top: -1px; left: -1px; right: -1px; height: 2px;
  background: var(--cor-acento); border-radius: var(--raio) var(--raio) 0 0;
  transform: scaleX(0); transform-origin: left; transition: transform .35s ease;
}
.card::after {
  content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(
    to right,
    transparent 0%,
    rgba(200, 162, 74, 0.04) 42%,
    rgba(200, 162, 74, 0.10) 50%,
    rgba(200, 162, 74, 0.04) 58%,
    transparent 100%
  );
  transform: rotate(25deg) translateX(-120%);
  transition: transform .7s ease;
  pointer-events: none;
}
.card:hover {
  transform: translateY(-8px);
  border-color: var(--cor-acento);
  box-shadow: 0 22px 50px var(--cor-sombra), 0 0 40px rgba(200, 162, 74, 0.06);
}
.card:hover::before { transform: scaleX(1); }
.card:hover::after { transform: rotate(25deg) translateX(60%); }

.card__icone {
  display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 22px;
  border: 1px solid var(--cor-borda); border-radius: 12px;
  background: linear-gradient(135deg, var(--cor-fundo-sec), var(--cor-superficie));
  color: var(--cor-acento-texto);
  transition: transform .4s ease, background .35s ease, border-color .35s ease, color .35s ease;
}
.card__icone svg { width: 26px; height: 26px; }
.card:hover .card__icone {
  transform: scale(1.1) rotate(-5deg);
  background: linear-gradient(135deg, var(--cor-acento), var(--hero-acento));
  border-color: var(--cor-acento);
  color: #101828;
}

.card h3 { margin-bottom: 12px; }
.card p { font-size: .98rem; }

.card__especialidade {
  display: inline-flex; align-items: center; gap: 5px;
  margin-bottom: 14px;
  padding: 5px 13px;
  background: rgba(200,162,74,.12); border: 1px solid rgba(200,162,74,.30); border-radius: 999px;
  font-family: var(--fonte-corpo); font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--cor-acento-texto);
}
.card__especialidade svg { width: 11px; height: 11px; fill: var(--cor-acento); flex-shrink: 0; }

.lista-check { margin-top: 20px; display: grid; gap: 11px; }
.lista-check li {
  position: relative; display: flex; align-items: flex-start; gap: 11px;
  font-size: .94rem; color: var(--cor-texto-sec);
}
.lista-check svg { width: 17px; height: 17px; color: var(--cor-musgo); flex-shrink: 0; margin-top: 5px; }

/* ---------- Sobre ---------- */
.sobre-wrapper {
  position: relative; overflow: hidden;
}
.sobre__logo-bg {
  position: absolute; right: -4%; top: 50%; transform: translateY(-50%);
  width: 380px; height: 380px; object-fit: contain;
  opacity: 0.05; pointer-events: none; z-index: 0;
}
@media (min-width: 768px) {
  .sobre__logo-bg { width: 480px; height: 480px; right: 0; }
}
@media (min-width: 1025px) {
  .sobre__logo-bg { width: 560px; height: 560px; right: 2%; }
}

.sobre__texto { max-width: 72ch; position: relative; z-index: 1; }
.sobre__texto p + p { margin-top: 18px; }
.sobre__texto p { font-size: 1.05rem; }

.pilares { display: grid; gap: 18px; margin-top: 40px; position: relative; z-index: 1; }
@media (min-width: 768px) { .pilares { grid-template-columns: repeat(3, 1fr); } }
.pilar {
  border-left: 2px solid var(--cor-acento); padding: 4px 0 4px 18px;
}
.pilar h3 {
  font-family: var(--fonte-corpo); font-size: .72rem; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase; color: var(--cor-acento-texto); margin-bottom: 8px;
}
.pilar p { font-size: .95rem; }

.processo { margin-top: 56px; padding-top: 48px; border-top: 1px solid var(--cor-borda); position: relative; z-index: 1; }
.processo__titulo { margin-bottom: 32px; }

/* ==========================================================================
   Hooks

function useTheme() {
  const [theme, setTheme] = useState(
    () => document.documentElement.getAttribute('data-theme') || 'light'
  );
  const changeTheme = useCallback(() => {
    setTheme((atual) => {
      const prox = atual === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', prox);
      try { localStorage.setItem('theme', prox); } catch (e) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', prox === 'dark' ? '#0D1420' : '#16233A');
      return prox;
    });
  }, []);
  return [theme, changeTheme];
}

function useReveal() {
  useEffect(() => {
    const reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const alvos = document.querySelectorAll('.reveal');
    if (reduzido || !('IntersectionObserver' in window)) {
      alvos.forEach((el) => el.classList.add('visivel'));
      return;
    }
    const obs = new IntersectionObserver(
      (entradas) => {
        entradas.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add('visivel'); obs.unobserve(e.target); }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    alvos.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  });
}

function Header({ theme, onThemeChange, whatsHref }) {
  const [aberto, setAberto] = useState(false);
  const btnMenuRef = useRef(null);
  const links = [
    { id: 'sobre', rotulo: T.nav.sobre },
    { id: 'areas', rotulo: T.nav.areas },
    { id: 'depoimentos', rotulo: T.nav.depoimentos },
    { id: 'faq', rotulo: T.nav.faq },
    { id: 'consulta', rotulo: T.nav.consulta },
    { id: 'contato', rotulo: T.nav.contato },
  ];

  useEffect(() => {
    document.body.classList.toggle('menu-aberto', aberto);
    return () => document.body.classList.remove('menu-aberto');
  }, [aberto]);

  useEffect(() => {
    if (!aberto) return;
    const onKey = (e) => {
      if (e.key === 'Escape') { setAberto(false); if (btnMenuRef.current) btnMenuRef.current.focus(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [aberto]);

  return (
    <header className="cabecalho">
      <div className="container cabecalho__inner">
        <Marca />
        <nav className="nav-desktop" aria-label={T.a11y.navPrincipal}>
          {links.map((l) => (
            <a key={l.id} className="nav-link" href={'#' + l.id}>{l.rotulo}</a>
          ))}
        </nav>
        <div className="controles">
          <DarkModeToggle theme={theme} onChange={onThemeChange} />
          <a className="cabecalho__cta" href={whatsHref} target="_blank" rel="noopener noreferrer">
            <IconeWhats style={{ width: 18, height: 18 }} />
            <span>{T.nav.cta}</span>
          </a>
          <button
            ref={btnMenuRef}
            type="button"
            className="btn-menu"
            onClick={() => setAberto((v) => !v)}
            aria-expanded={aberto}
            aria-controls="menu-mobile"
            aria-label={aberto ? T.a11y.menuFechar : T.a11y.menuAbrir}
          >
            {aberto ? <IconeFechar /> : <IconeMenu />}
          </button>
        </div>
      </div>
      {aberto && (
        <div className="menu-mobile" id="menu-mobile">
          <nav aria-label={T.a11y.navPrincipal}>
            <ul className="menu-mobile__lista">
              {links.map((l) => (
                <li key={l.id}>
                  <a className="menu-mobile__link" href={'#' + l.id} onClick={() => setAberto(false)}>
                    {l.rotulo}
                  </a>
                </li>
              ))}
            </ul>
          </nav>
          <a
            className="btn--whats btn--bloco menu-mobile__cta"
            style={{ display: 'flex', justifyContent: 'center' }}
            href={whatsHref}
            target="_blank"
            rel="noopener noreferrer"
            onClick={() => setAberto(false)}
          >
            <IconeWhats style={{ width: 20, height: 20 }} />
            {T.nav.cta}
          </a>
        </div>
      )}
    </header>
  );
}

    <div className="depo-card__estrelas" aria-label={n + ' estrelas'}>
      {Array.from({ length: 5 }, (_, i) => (
        <IconeEstrela key={i} cheia={i < n} />
      ))}
    </div>
  );
}

function Depoimentos() {
  const cards = T.depoimentos.cards;

  const DepoCard = ({ d }) => (
    <figure className="depo-card">
      <Estrelas n={d.estrelas} />
      <blockquote className="depo-card__texto">&ldquo;{d.texto}&rdquo;</blockquote>
      <figcaption className="depo-card__rodape">
        <div className="depo-card__avatar" aria-hidden="true">
          {d.autor.charAt(0)}
        </div>
        <div>
          <p className="depo-card__autor">{d.autor}</p>
          <p className="depo-card__cidade">{d.cidade}</p>
        </div>
      </figcaption>
    </figure>
  );

  const Grupo = ({ ariaHidden }) => (
    <div className="depo-marquee__group" aria-hidden={ariaHidden || undefined}>
      {cards.map((d, i) => <DepoCard key={i} d={d} />)}
    </div>
  );

  return (
    <section className="secao" id="depoimentos" aria-labelledby="depoimentos-titulo">
      <div className="container">
        <div className="cabecalho-secao reveal">
          <p className="sobrelinha">{T.depoimentos.sobrelinha}</p>
          <h2 id="depoimentos-titulo">{T.depoimentos.titulo}</h2>
          <VigaBalanca />
          <p className="intro-secao">{T.depoimentos.intro}</p>
        </div>
      </div>
      <div className="depo-marquee">
        <div className="depo-marquee__track">
          <Grupo />
          <Grupo ariaHidden="true" />
        </div>
      </div>
    </section>
  );
}

function ItemFaq({ item, indice }) {
  const [aberto, setAberto] = useState(false);
  const idBotao = 'faq-btn-' + indice;
  const idPainel = 'faq-painel-' + indice;
  return (
    <div className="faq__item">
      <h3>
        <button
          type="button"
          id={idBotao}
          className="faq__botao"
          aria-expanded={aberto}
          aria-controls={idPainel}
          onClick={() => setAberto((v) => !v)}
        >
          <span>{item.p}</span>
          <IconeMais className="faq__icone" />
        </button>
      </h3>
      <div
        id={idPainel}
        className={'faq__painel' + (aberto ? ' faq__painel--aberto' : '')}
        role="region"
        aria-labelledby={idBotao}
      >
        <div>
          <p className="faq__resposta">{item.r}</p>
        </div>
      </div>
    </div>
  );
}

function Faq() {
  return (
    <section className="secao secao--alt" id="faq" aria-labelledby="faq-titulo">
      <div className="container">
        <div className="cabecalho-secao reveal">
          <p className="sobrelinha">{T.faq.sobrelinha}</p>
          <h2 id="faq-titulo">{T.faq.titulo}</h2>
          <VigaBalanca />
          <p className="intro-secao">{T.faq.intro}</p>
        </div>
        <div className="faq reveal">
          {T.faq.itens.map((item, i) => <ItemFaq key={i} item={item} indice={i} />)}
        </div>
      </div>
    </section>
  );
}

/* Contato + Localização unificados */
function Contato({ whatsHref }) {
  const canalIcone = { whats: IconeWhats, email: IconeEmail, insta: IconeInsta, local: IconeLocal, horario: IconeRelogio };
  const canalValor = {
    whats: CONTATO.whatsappExibicao,
    email: CONTATO.email,
    insta: CONTATO.instagram,
    local: CONTATO.endereco,
    horario: CONTATO.horario,
  };
  const canalHref = {
    whats: whatsHref,
    email: 'mailto:' + CONTATO.email,
    insta: CONTATO.instagramUrl,
    local: null,
    horario: null,
  };

  const temMapa = CONTATO.MAPA_EMBED_SRC && CONTATO.MAPA_EMBED_SRC.length > 0;

  return (
    <section className="secao" id="contato" aria-labelledby="contato-titulo">
      <div className="container">
        <div className="contato-grade reveal">
          <div className="contato-info">
            <p className="sobrelinha">{T.contato.sobrelinha}</p>
            <h2 id="contato-titulo">{T.contato.titulo}</h2>
            <VigaBalanca />
            <p style={{ marginTop: 14, fontSize: '1.02rem', maxWidth: '52ch' }}>{T.contato.texto}</p>

            <div className="contato-cta">
              <a className="btn--whats" href={whatsHref} target="_blank" rel="noopener noreferrer">
                <IconeWhats style={{ width: 20, height: 20 }} />
                {T.contato.ctaPrimario}
              </a>
            </div>

            <div className="contato-canais">
              {T.contato.canais.map((canal, i) => {
                const Ic = canalIcone[canal.tipo];
                const href = canalHref[canal.tipo];
                const valor = canalValor[canal.tipo];
                return (
                  <div className="contato-canal" key={i}>
                    <span className="contato-canal__icone"><Ic /></span>
                    <div className="contato-canal__corpo">
                      <span className="contato-canal__rotulo">{canal.rotulo}</span>
                      {href
                        ? <a className="contato-canal__valor" href={href} target={canal.tipo !== 'email' ? '_blank' : undefined} rel="noopener noreferrer">{valor}</a>
                        : <span className="contato-canal__valor" style={{ color: 'var(--cor-texto)' }}>{valor}</span>
                      }
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="mapa-wrapper">
            {temMapa ? (
              <iframe
                className="mapa-iframe"
                src={CONTATO.MAPA_EMBED_SRC}
                title="Localização do escritório"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowFullScreen
              />
            ) : (
              <div className="mapa-placeholder">
                <IconeLocal />
                <p>Cole o seu embed do Google Maps</p>
                <p>No arquivo <code>index.html</code>, edite o campo <code>MAPA_EMBED_SRC</code> na constante CONTATO com o link do iframe gerado pelo Google Maps.</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

function Rodape({ whatsHref }) {
  const links = [
    { id: 'sobre', rotulo: T.nav.sobre },
    { id: 'areas', rotulo: T.nav.areas },
    { id: 'depoimentos', rotulo: T.nav.depoimentos },
    { id: 'faq', rotulo: T.nav.faq },
    { id: 'consulta', rotulo: T.nav.consulta },
    { id: 'contato', rotulo: T.nav.contato },
  ];
  return (
    <footer className="rodape">
      <div className="container">
        <div className="rodape__grade">
          <div>
            <Marca />
            <p className="rodape__desc">{T.rodape.desc}</p>
            <p className="rodape__desc" style={{ marginTop: 12, letterSpacing: '.08em', fontSize: '.82rem' }}>
              {CONTATO.oab}
            </p>
          </div>
          <nav aria-label={T.a11y.navRodape}>
            <p className="rodape__titulo">{T.rodape.navTitulo}</p>
            <ul className="rodape__lista">
              {links.map((l) => (
                <li key={l.id}><a href={'#' + l.id}>{l.rotulo}</a></li>
              ))}
            </ul>
          </nav>
          <div>
            <p className="rodape__titulo">{T.rodape.contatoTitulo}</p>
            <ul className="rodape__lista">
              <li><a href={whatsHref} target="_blank" rel="noopener noreferrer">{CONTATO.whatsappExibicao}</a></li>
              <li><a href={'mailto:' + CONTATO.email}>{CONTATO.email}</a></li>
              <li><a href={CONTATO.instagramUrl} target="_blank" rel="noopener noreferrer">{CONTATO.instagram}</a></li>
              <li><span>{CONTATO.horario}</span></li>
            </ul>
          </div>
        </div>
        <div className="rodape__base">
          <p className="rodape__aviso">{T.rodape.aviso}</p>
          <p className="rodape__copy">&copy; {CONTATO.ano} Advocacia Almeida. {T.rodape.direitos}</p>
        </div>
      </div>
    </footer>
  );
}

function WhatsFlutuante({ whatsHref }) {
  return (
    <a className="whats-float" href={whatsHref} target="_blank" rel="noopener noreferrer" aria-label={T.a11y.whatsFlutuante}>
      <IconeWhats />
      <span className="whats-float__txt">WhatsApp</span>
    </a>
  );
}

/* ==========================================================================
   Quiz de consulta
   ========================================================================== */
const QUIZ_DADOS = {
  trabalhista: {
    icone: IconeBalanca,
    label: 'Direito do Trabalho',
    desc: 'Demissão, horas extras não pagas, assédio, reconhecimento de vínculo — tudo que envolve a relação entre empregado e empregador.',
    especialidade: true,
    situacoes: [
      'Fui demitido(a) e tenho dúvidas sobre meus direitos',
      'Não recebi horas extras ou outros valores devidos',
      'Questiono o tipo de demissão (justa causa / rescisão indireta)',
      'Assédio moral, sexual ou ambiente de trabalho hostil',
      'Reconhecimento de vínculo empregatício',
      'Sou empresa e preciso de consultoria preventiva ou contenciosa',
      'Outro',
    ],
  },
  previdenciario: {
    icone: IconeEscudo,
    label: 'Direito Previdenciário',
    desc: 'Aposentadoria, auxílio-doença, revisão de benefícios e recursos junto ao INSS — questões sobre o que você recebe ou vai receber do governo.',
    especialidade: false,
    situacoes: [
      'Aposentadoria negada ou em análise no INSS',
      'Quero revisar um benefício já concedido',
      'Auxílio por doença ou incapacidade permanente',
      'Pensão por morte ou BPC/LOAS',
      'Planejamento previdenciário (quero me planejar)',
      'Recurso contra decisão administrativa',
      'Outro',
    ],
  },
};

function Quiz({ whatsHref }) {
  const [passo, setPasso] = useState(1);
  const [area, setArea] = useState(null);
  const [situacao, setSituacao] = useState(null);
  const [descricao, setDescricao] = useState('');
  const [nome, setNome] = useState('');

  const totalPassos = 3;

  function handleArea(chave) {
    setArea(chave);
    setSituacao(null);
    setPasso(2);
  }

  function handleSituacao(s) {
    setSituacao(s);
    setPasso(3);
  }

  function handleEnviar() {
    const dadosArea = QUIZ_DADOS[area];
    const linhas = [
      '*Consulta — Advocacia Almeida*',
      '',
      '🏛️ *Área:* ' + dadosArea.label,
      '📋 *Situação:* ' + situacao,
      descricao.trim() ? '📝 *Detalhes:* ' + descricao.trim() : null,
      nome.trim() ? '👤 *Nome:* ' + nome.trim() : null,
    ].filter(Boolean);
    const msg = linhas.join('\n');
    window.open('https://wa.me/' + CONTATO.whatsappNumero + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
  }

  const Progresso = () => (
    <div className="quiz-progresso" aria-label={'Passo ' + passo + ' de ' + totalPassos}>
      {Array.from({ length: totalPassos }, (_, i) => (
        <div key={i} className={'quiz-progresso__passo' + (i < passo ? ' quiz-progresso__passo--ativo' : '')} />
      ))}
    </div>
  );

  return (
    <section className="secao secao--alt" id="consulta" aria-labelledby="consulta-titulo">
      <div className="container">
        <div className="cabecalho-secao reveal">
          <p className="sobrelinha">Consulta gratuita</p>
          <h2 id="consulta-titulo">Descreva seu caso</h2>
          <VigaBalanca />
          <p className="intro-secao">Responda três perguntas rápidas e enviaremos uma mensagem organizada direto para o WhatsApp do escritório — sem custo e sem compromisso.</p>
        </div>

        <div className="quiz-wrapper reveal">
          <Progresso />

          {passo === 1 && (
            <>
              <p className="quiz-titulo">Qual é a área do seu caso?</p>
              <p className="quiz-sub">Selecione a que melhor descreve a sua situação.</p>
              <div className="quiz-opcoes quiz-opcoes--2">
                {Object.entries(QUIZ_DADOS).map(([chave, d]) => {
                  const Ic = d.icone;
                  return (
                    <button key={chave} type="button" className={'quiz-opcao' + (area === chave ? ' quiz-opcao--selecionado' : '')} onClick={() => handleArea(chave)}>
                      <span className="quiz-opcao__icone"><Ic /></span>
                      <span className="quiz-opcao__corpo">
                        <span className="quiz-opcao__titulo">{d.label}</span>
                        <span className="quiz-opcao__desc">{d.desc}</span>
                        {d.especialidade && (
                          <span className="quiz-opcao__badge">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            Especialidade principal
                          </span>
                        )}
                      </span>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          {passo === 2 && area && (
            <>
              <p className="quiz-titulo">Qual é a sua situação?</p>
              <p className="quiz-sub">Escolha a opção mais próxima do seu caso.</p>
              <div className="quiz-opcoes">
                {QUIZ_DADOS[area].situacoes.map((s) => (
                  <button key={s} type="button" className={'quiz-opcao' + (situacao === s ? ' quiz-opcao--selecionado' : '')} onClick={() => handleSituacao(s)}>
                    <span className="quiz-opcao__icone"><IconeCheck /></span>
                    <span>{s}</span>
                  </button>
                ))}
              </div>
              <div className="quiz-acoes">
                <button type="button" className="quiz-volta" onClick={() => setPasso(1)}>← Voltar</button>
              </div>
            </>
          )}

          {passo === 3 && (
            <>
              <p className="quiz-titulo">Mais algum detalhe?</p>
              <p className="quiz-sub">Opcional — mas ajuda o Dr. Diego a entender melhor o seu caso antes do primeiro contato.</p>
              <label className="quiz-label" htmlFor="quiz-descricao">Conte um pouco mais (opcional)</label>
              <textarea
                id="quiz-descricao"
                className="quiz-textarea"
                placeholder="Ex.: fui demitido há 15 dias e não recebi o FGTS…"
                value={descricao}
                onChange={(e) => setDescricao(e.target.value)}
                maxLength={800}
              />
              <label className="quiz-label" htmlFor="quiz-nome">Seu nome (opcional)</label>
              <input
                id="quiz-nome"
                type="text"
                className="quiz-input"
                placeholder="Como prefere ser chamado(a)?"
                value={nome}
                onChange={(e) => setNome(e.target.value)}
                maxLength={80}
              />
              <div className="quiz-acoes">
                <button type="button" className="btn--whats" onClick={handleEnviar}>
                  <IconeWhats style={{ width: 20, height: 20 }} />
                  Enviar pelo WhatsApp
                </button>
                <button type="button" className="quiz-volta" onClick={() => setPasso(2)}>← Voltar</button>
              </div>
              <p className="quiz-nota">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
                Ao clicar em "Enviar", o WhatsApp abrirá com uma mensagem já formatada. Você confirma o envio pelo próprio aplicativo.
              </p>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

/* ==========================================================================
   App
   ========================================================================== */
function App() {
  const [theme, changeTheme] = useTheme();
  const whatsHref = linkWhatsApp(T.whatsMsg);
  useReveal();

  return (
    <>
      <Header theme={theme} onThemeChange={changeTheme} whatsHref={whatsHref} />
      <main id="conteudo">
        <Hero whatsHref={whatsHref} />
        <CredenciaisFaixa />
        <Areas />
        <Sobre />
        <Depoimentos />
        <Faq />
        <Quiz whatsHref={whatsHref} />
        <Contato whatsHref={whatsHref} />
      </main>
      <Rodape whatsHref={whatsHref} />
      <WhatsFlutuante whatsHref={whatsHref} />
    </>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
